<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chat · Pyrometrics</title><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet"><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="assets/estilo.css"></head><body><canvas id="cielo" aria-hidden="true"></canvas><header id="top"></header><main><div class="side"><aside id="sb"><div class="seg" role="tablist"><button class="on" data-t="hist" role="tab">My chats</button><button data-t="faq" role="tab">FAQ</button></div>
<input class="sch" id="bq" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"><button class="btn" style="width:100%" onclick="nuevo()">New chat</button>
<h3 id="stit">History</h3><div id="hist"><span class="muted" style="font-size:.85rem">Sign in to save your chats.</span></div><div id="faq" hidden></div></aside>
<div class="chat"><button class="btn ghost tg" style="margin:8px 12px 0;align-self:flex-start" onclick="sb.classList.toggle('open')">Chats</button><div id="msgs"></div>
<form class="bar" onsubmit="send(event)"><input id="q" maxlength="600" placeholder="Ask about combustion in microgravity…" autocomplete="off" aria-label="Question"><button class="btn">Send</button></form></div></div>
</main><script src="assets/local.js"></script><script src="assets/app.js"></script><script>
let chat=0;const sb=$('sb');
const EJ=['What is a cool flame?','What changed in the porosity of hydrated cement in microgravity?','How does droplet extinction behave in microgravity?'];
function welcome(){$('msgs').innerHTML='<div style="margin:auto;text-align:center;max-width:640px"><h1>What do you want to know about fire in microgravity?</h1><p class="muted">I answer only from the loaded NASA documentation and cite the source page.</p><div class="chips">'+EJ.map(e=>`<button class="chip" onclick="send(null,this.textContent)">${esc(e)}</button>`).join('')+'</div></div>'}
function add(role,t,src){const d=document.createElement('div');d.className='m '+role;
 if(role==='assistant'){d.innerHTML=esc(t).replace(/\[(\d+)\]/g,(m,n)=>{const s=(src||[]).find(x=>x.n==n);return s?`<a href="${esc(s.url)}" target="_blank" rel="noopener">[${n}]</a>`:m});
  if(src&&src.length)d.innerHTML+='<small>Sources: '+src.map(s=>`[${s.n}] <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')+'</small>'}else d.textContent=t;
 $('msgs').append(d);$('msgs').scrollTop=1e9}
function nuevo(){chat=0;welcome();sb.classList.remove('open')}
async function send(e,txt){e&&e.preventDefault();const t=(txt||$('q').value).trim();if(!t)return;$('q').value='';if($('msgs').querySelector('h1'))$('msgs').innerHTML='';add('user',t);sb.classList.remove('open');
 const w=document.createElement('div');w.className='m assistant muted';w.textContent='Searching the documentation…';$('msgs').append(w);
 const r=await api('chat',{msg:t,chat});w.remove();if(r.error)return add('assistant',r.error);chat=r.chat;add('assistant',r.reply,r.sources);side()}
async function side(){const f=await api('faq');$('faq').innerHTML=(f||[]).map(c=>`<button class="it" data-q="${esc(c.q)}"><i class="ic">?</i><span><b>${esc(c.q)}</b></span></button>`).join('')||'<span class="muted" style="font-size:.85rem">None yet.</span>';
 if(USER){const h=await api('chats');$('hist').innerHTML=(h||[]).map(c=>`<button class="it" data-c="${c.id}"><i class="ic">&#9679;</i><span><b>${esc(c.title)}</b>${c.ts?`<small>${new Date(c.ts*1000).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})}</small>`:''}</span></button>`).join('')||'<span class="muted" style="font-size:.85rem">No chats yet.</span>'}}
sb.onclick=async e=>{const b=e.target.closest('.it');if(!b)return;if(b.dataset.q)return send(null,b.dataset.q);chat=+b.dataset.c;$('msgs').innerHTML='';(await api('load',{chat})).forEach(m=>add(m.role,m.content));sb.classList.remove('open')};
function tab(t){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('hist').hidden=t!=='hist';$('faq').hidden=t!=='faq';$('stit').textContent=t==='hist'?'History':'Frequently asked questions';$('bq').dataset.t=t;filtra()}
function filtra(){const q=$('bq').value.toLowerCase();document.querySelectorAll('#hist .it,#faq .it').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))}
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');b&&tab(b.dataset.t)};$('bq').oninput=filtra;
(async()=>{await init('chat');welcome();await side();tab(USER?'hist':'faq')})();
</script></body></html>
